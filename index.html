<!DOCTYPE html>
<html>
<head>
    <title>Consumer Search</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }
        input {
            padding: 10px;
            width: 300px;
        }
        button {
            padding: 10px 20px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>

<h2>Consumer Search</h2>

<input type="text" id="searchInput" placeholder="Enter search value">
<button onclick="searchData()">Search</button>

<div id="result"></div>

<script>
let csvData = [];

fetch('data.csv')
.then(response => response.text())
.then(text => {
    const rows = text.split('\n');
    csvData = rows.map(row => row.split(','));
});

function searchData() {
    const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();

    // If search box is empty
    if (searchValue === "") {
        document.getElementById('result').innerHTML = 
        "<div class='no-result'>Please enter a value to search</div>";
        return;
    }

    let found = false;
    let output = "<table><tr>";

    headers.forEach(header => {
        output += "<th>" + header + "</th>";
    });

    output += "</tr>";

    csvData.forEach(row => {
        if (row.join(" ").toLowerCase().includes(searchValue)) {
            found = true;
            output += "<tr>";
            row.forEach(cell => {
                output += "<td>" + cell + "</td>";
            });
            output += "</tr>";
        }
    });

    output += "</table>";

    if (found) {
        document.getElementById('result').innerHTML = output;
    } else {
        document.getElementById('result').innerHTML = 
        "<div class='no-result'>No Record Found</div>";
    }
}
</script>

</body>
</html>
