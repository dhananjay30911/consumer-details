<!DOCTYPE html>
<html>
<head>
    <title>Consumer Search Portal</title>

    <!-- Important for Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
        }

        .search-container {
            margin: 20px 0;
        }

        input {
            padding: 10px;
            width: 60%;
            max-width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin-left: 5px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #34495e;
        }

        .table-container {
            overflow-x: auto; /* Important for mobile scrolling */
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
            min-width: 600px; /* Prevent table breaking */
        }

        th {
            background: #2c3e50;
            color: white;
            padding: 10px;
        }

        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .message {
            color: red;
            margin-top: 15px;
            font-weight: bold;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            input {
                width: 90%;
                margin-bottom: 10px;
            }

            button {
                width: 95%;
                margin: 5px 0;
            }
        }
    </style>
</head>
<body>

<h2>Consumer Search Portal</h2>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Enter Account No / Name">
    <button onclick="searchData()">Search</button>
</div>

<div id="result"></div>

<script>
let jsonData = [];

fetch('data.json')
.then(response => response.json())
.then(data => {
    jsonData = data;
});

function searchData() {
    const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();

    if (searchValue.length < 3) {
        document.getElementById('result').innerHTML =
        "<div class='message'>Enter at least 3 characters</div>";
        return;
    }

    let output = "";
    let found = false;

    jsonData.forEach(item => {

        let rowText = Object.values(item).join(" ").toLowerCase();

        if (rowText.includes(searchValue)) {
            found = true;

            if (output === "") {
                output += "<div class='table-container'><table><tr>";

                Object.keys(item).forEach(key => {
                    output += "<th>" + key + "</th>";
                });

                output += "</tr>";
            }

            output += "<tr>";
            Object.values(item).forEach(value => {
                output += "<td>" + value + "</td>";
            });
            output += "</tr>";
        }
    });

    if (found) {
        output += "</table></div>";
        document.getElementById('result').innerHTML = output;
    } else {
        document.getElementById('result').innerHTML =
        "<div class='message'>No Record Found</div>";
    }
}
</script>

</body>
</html>
