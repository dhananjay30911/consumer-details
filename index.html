<!DOCTYPE html>
<html>
<head>
    <title>Consumer Search</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }
        input {
            padding: 10px;
            width: 300px;
        }
        button {
            padding: 10px 20px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>

<h2>Consumer Search</h2>

<input type="text" id="searchInput" placeholder="Enter search value">
<button onclick="searchData()">Search</button>

<div id="result"></div>

<script>
let csvData = [];
let headers = [];

fetch('data.csv')
.then(response => response.text())
.then(text => {
    const rows = text.trim().split('\n');

    headers = rows[0].split(',');

    csvData = rows.slice(1).map(row => row.toLowerCase());
})
.catch(error => {
    console.error("Error loading CSV:", error);
});

function searchData() {
    const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();

    if (searchValue === "") {
        document.getElementById('result').innerHTML =
        "<div style='color:red;'>Please enter a value to search</div>";
        return;
    }

    let output = "";
    let found = false;

    csvData.forEach(row => {
        if (row.includes(searchValue)) {
            found = true;
            const columns = row.split(',');

            if (output === "") {
                output += "<table><tr>";
                headers.forEach(header => {
                    output += "<th>" + header + "</th>";
                });
                output += "</tr>";
            }

            output += "<tr>";
            columns.forEach(col => {
                output += "<td>" + col + "</td>";
            });
            output += "</tr>";
        }
    });

    if (found) {
        output += "</table>";
        document.getElementById('result').innerHTML = output;
    } else {
        document.getElementById('result').innerHTML =
        "<div style='color:red;'>No Record Found</div>";
    }
}
</script>

</body>
</html>
